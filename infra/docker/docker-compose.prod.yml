services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: qalago
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: qalago
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qalago']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: services/catalog-api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://qalago:${POSTGRES_PASSWORD:-change_me}@postgres:5432/qalago?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      OTP_DEBUG: 'false'
      DEFAULT_CITY_SLUG: uralsk
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      UPLOAD_DIR: /app/services/catalog-api/uploads
      MAX_UPLOAD_MB: 5
    volumes:
      - uploads:/app/services/catalog-api/uploads

volumes:
  pgdata:
  uploads:
